<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Artecon · Análise de IRRF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #f4f6f9;
  --surface:   #ffffff;
  --surface-2: #f0f2f5;
  --border:    rgba(0,0,0,0.08);
  --border-lt: rgba(0,0,0,0.14);
  --text:      #1a2332;
  --text-2:    #4a5568;
  --text-3:    #8896a8;
  --azul:      #1a5276;
  --azul-lt:   #d6e4f0;
  --azul-dim:  #154360;
  --green:     #1e8449;
  --green-lt:  #eafaf1;
  --red:       #c0392b;
  --red-lt:    #fdedec;
  --amber:     #b7770d;
  --amber-lt:  #fef9e7;
  --roxo:      #6c3483;
  --roxo-lt:   #f4ecf7;
  --sidebar-w: 210px;
  --radius:    12px;
  --shadow:    0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.14);
  --font:      'DM Sans', sans-serif;
  --mono:      'DM Mono', monospace;
  --tr:        160ms cubic-bezier(.4,0,.2,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 13.5px; color: var(--text); }
::placeholder { color: var(--text-3); }

/* ── AUTH ─────────────────────────────────────── */
#auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 500; padding: 16px; }
.auth-wrap { width: 100%; max-width: 380px; }
.auth-brand { text-align: center; margin-bottom: 20px; }
.auth-brand img { max-width: 190px; height: auto; }
.auth-brand .app-name { font-size: 13px; font-weight: 700; color: var(--azul); letter-spacing: .02em; margin-top: 6px; }
.auth-brand .app-sub { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px 24px; }
.auth-err { color: var(--red); font-size: 12.5px; margin-top: 10px; min-height: 16px; text-align: center; }
.auth-note { margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--text-3); line-height: 1.55; }

/* ── CAMPOS ───────────────────────────────────── */
.field { margin-bottom: 13px; }
.field label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; letter-spacing: .02em; }
.field input, .field select, .field textarea {
  width: 100%; padding: 8px 11px; border: 1px solid var(--border-lt); border-radius: 8px;
  background: var(--surface); transition: border-color var(--tr), box-shadow var(--tr);
}
.field textarea { resize: vertical; min-height: 60px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px var(--azul-lt); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.check-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin-bottom: 13px; }
.check-line input { width: 15px; height: 15px; accent-color: var(--azul); }

/* ── BOTÕES ───────────────────────────────────── */
.btn-primary { width: 100%; padding: 10px; background: var(--azul); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; transition: background var(--tr); }
.btn-primary:hover { background: var(--azul-dim); }
.btn-primary:disabled { opacity: .6; cursor: default; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border-lt); background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 500; transition: all var(--tr); }
.btn:hover { border-color: var(--azul); color: var(--azul); }
.btn.solid { background: var(--azul); border-color: var(--azul); color: #fff; }
.btn.solid:hover { background: var(--azul-dim); }
.btn.danger { color: var(--red); }
.btn.danger:hover { border-color: var(--red); background: var(--red-lt); }
.btn.sm { padding: 4px 10px; font-size: 12px; }

/* ── LAYOUT ───────────────────────────────────── */
#app { display: none; }
.sidebar { width: var(--sidebar-w); height: 100vh; height: 100dvh; position: fixed; left: 0; top: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; z-index: 300; overflow: hidden; }
.sidebar-brand { padding: 14px 16px 8px; }
.sidebar-brand img { max-width: 140px; height: auto; display: block; }
.sidebar-app { padding: 0 16px 10px; border-bottom: 1px solid var(--border); }
.sidebar-app .t { font-size: 12px; font-weight: 700; color: var(--azul); }
.sidebar-app .s { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
.sidebar-nav { flex: 1; padding: 8px 10px; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--border-lt) transparent; }
.nav-section { font-size: 10px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .08em; padding: 10px 8px 4px; }
.nav-item { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border: none; background: none; border-radius: 8px; color: var(--text-2); font-size: 13px; font-weight: 500; text-align: left; transition: all var(--tr); }
.nav-item:hover { background: var(--bg); }
.nav-item.active { background: var(--azul-lt); color: var(--azul); font-weight: 600; }
.nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
.sidebar-footer { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-3); }
.sidebar-footer .u { color: var(--text-2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidebar-footer button { background: none; border: none; color: var(--azul); font-size: 11.5px; padding: 2px 0; font-weight: 600; }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 290; }

.main { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
.topbar h1 { font-size: 17px; font-weight: 700; }
.topbar .spacer { flex: 1; }
.burger { display: none; background: none; border: none; padding: 4px; color: var(--text-2); }
.burger svg { width: 22px; height: 22px; }
.content { padding: 20px 24px 60px; max-width: 1280px; width: 100%; }

/* ── COMPONENTES ──────────────────────────────── */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.card .k { font-size: 11px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
.card .v { font-size: 24px; font-weight: 700; font-family: var(--mono); margin-top: 2px; }
.card .d { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; overflow: hidden; }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.panel-head h2 { font-size: 14.5px; font-weight: 700; flex: 1; min-width: 140px; }
.panel-body { padding: 16px; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar input[type=search], .toolbar select { padding: 7px 11px; border: 1px solid var(--border-lt); border-radius: 8px; background: var(--surface); }
.toolbar input[type=search] { min-width: 220px; flex: 1; max-width: 340px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { padding: 5px 12px; border-radius: 99px; border: 1px solid var(--border-lt); background: var(--surface); font-size: 12px; font-weight: 500; color: var(--text-2); transition: all var(--tr); }
.chip:hover { border-color: var(--azul); }
.chip.active { background: var(--azul); border-color: var(--azul); color: #fff; }

.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; padding: 9px 12px; border-bottom: 1px solid var(--border-lt); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: none; }
.tbl tbody tr { transition: background var(--tr); }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl tbody tr.clickable:hover { background: var(--bg); }
.tbl .num { font-family: var(--mono); text-align: right; white-space: nowrap; }
.tbl .muted { color: var(--text-3); }
.empty { padding: 36px 16px; text-align: center; color: var(--text-3); font-size: 13px; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2.5px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-green { background: var(--green-lt); color: var(--green); }
.b-red { background: var(--red-lt); color: var(--red); }
.b-amber { background: var(--amber-lt); color: var(--amber); }
.b-azul { background: var(--azul-lt); color: var(--azul); }
.b-gray { background: var(--surface-2); color: var(--text-2); }
.b-roxo { background: var(--roxo-lt); color: var(--roxo); }

/* barras de distribuição (dashboard) */
.dist { display: grid; gap: 8px; }
.dist-row { display: grid; grid-template-columns: 130px 1fr 58px; gap: 10px; align-items: center; font-size: 12.5px; }
.dist-row .lbl { color: var(--text-2); font-weight: 500; text-align: right; }
.dist-row .bar { height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.dist-row .bar i { display: block; height: 100%; border-radius: 4px 0 0 4px; min-width: 2px; }
.dist-row .qt { font-family: var(--mono); color: var(--text-2); }

/* ── MODAL ────────────────────────────────────── */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: flex-start; justify-content: center; z-index: 400; padding: 24px 16px; overflow-y: auto; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 100%; max-width: 640px; margin: auto 0; }
.modal.wide { max-width: 860px; }
.modal-head { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid var(--border); }
.modal-head h3 { font-size: 15.5px; font-weight: 700; flex: 1; }
.modal-close { background: none; border: none; font-size: 22px; line-height: 1; color: var(--text-3); padding: 2px 6px; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 18px 20px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--border); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: -18px -20px 16px; padding: 0 12px; overflow-x: auto; }
.tab { padding: 11px 14px; border: none; background: none; font-size: 13px; font-weight: 600; color: var(--text-3); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab.active { color: var(--azul); border-bottom-color: var(--azul); }

.doc-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; }
.doc-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--green); flex-shrink: 0; }
.doc-item .lbl { flex: 1; font-size: 13px; }
.doc-item .lbl.ok { color: var(--text-3); text-decoration: line-through; }
.doc-item input[type=date] { padding: 3px 6px; border: 1px solid var(--border-lt); border-radius: 6px; font-size: 12px; }
.doc-item .rm { background: none; border: none; color: var(--text-3); font-size: 16px; padding: 0 4px; }
.doc-item .rm:hover { color: var(--red); }

/* ── TOAST ────────────────────────────────────── */
.toast-container { position: fixed; bottom: 18px; right: 18px; z-index: 600; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 32px)); }
.toast { padding: 11px 16px; border-radius: 10px; background: var(--text); color: #fff; font-size: 13px; box-shadow: var(--shadow-lg); animation: slideIn .22s ease; }
.toast.error { background: var(--red); }
.toast.success { background: var(--green); }
@keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }

.loading { padding: 40px; text-align: center; color: var(--text-3); }
.mono { font-family: var(--mono); }

/* ── MOBILE ───────────────────────────────────── */
@media (max-width: 860px) {
  .sidebar { transform: translateX(-100%); transition: transform var(--tr); }
  body.sb-open .sidebar { transform: none; }
  body.sb-open .sidebar-overlay { display: block; }
  .main { margin-left: 0; }
  .burger { display: block; }
  .content { padding: 16px 16px 60px; }
  .field-row, .field-row-3 { grid-template-columns: 1fr; }
  .dist-row { grid-template-columns: 96px 1fr 50px; }
}
</style>
</head>
<body>

<div class="toast-container" id="toasts"></div>
<div class="sidebar-overlay" onclick="toggleSidebar(false)"></div>

<!-- LOGIN -->
<div id="auth-screen">
  <div class="auth-wrap">
    <div class="auth-brand">
      <img src="logo.gif" alt="Artecon">
      <div class="app-name">ANÁLISE DE IRRF</div>
      <div class="app-sub">Declarações IRPF · pendências · oportunidades</div>
    </div>
    <div class="auth-card">
      <form id="login-form" onsubmit="doLogin(event)">
        <div class="field"><label>E-mail</label><input type="email" id="l-email" placeholder="seu@artecon.cnt.br" autocomplete="email" required></div>
        <div class="field"><label>Senha</label><input type="password" id="l-senha" placeholder="••••••••" autocomplete="current-password" required></div>
        <button class="btn-primary" id="btn-login" type="submit">Entrar</button>
        <div class="auth-err" id="login-err"></div>
      </form>
      <div class="auth-note">Acesso restrito à equipe Artecon.<br>Para obter uma conta, solicite ao administrador.</div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="sidebar">
    <div class="sidebar-brand"><img src="logo.gif" alt="Artecon"></div>
    <div class="sidebar-app"><div class="t">ANÁLISE DE IRRF</div><div class="s">Gestão Empresarial e Financeiro</div></div>
    <nav class="sidebar-nav" id="nav"></nav>
    <div class="sidebar-footer">
      <div class="u" id="sb-user">—</div>
      <button onclick="doLogout()">Sair</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="burger" onclick="toggleSidebar()" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg></button>
      <h1 id="page-title">Dashboard</h1>
      <div class="spacer"></div>
    </div>
    <div class="content" id="content"><div class="loading">Carregando…</div></div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">×</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
// ANÁLISE DE IRRF · Artecon — v1 (2026-10-28)
// Banco: agenda-pro (Gestão Empresarial e Financeiro) · tabelas ir_*
// Auth: Supabase Auth (e-mail/senha) — RLS exige usuário autenticado
// ═══════════════════════════════════════════════════════════════════

const SUPA_URL = 'https://vuwgxndahrzinfdlapxz.supabase.co';
const SUPA_KEY = 'sb_publishable_n52t3_PPzeErFmL5eX07Cw_-qOkk-tH';
const db = supabase.createClient(SUPA_URL, SUPA_KEY);

const EXERCICIO_ATUAL = (() => { const h = new Date(); return h.getFullYear() + (h.getMonth() >= 2 ? 0 : 0); })();

const S = {
  user: null,
  page: 'dashboard',
  clientes: [], analises: [], pendencias: [], oportunidades: [],
  carregado: false,
  // filtros por página
  f: {
    cliBusca: '', cliChip: 'todos',
    anExercicio: 'todos', anBusca: '',
    peStatus: 'aberta', peSev: 'todas', peBusca: '',
    opStatus: 'todas', opBusca: '',
    clCliente: '', clAno: new Date().getFullYear(),
    rvCliente: '', rvAno: new Date().getFullYear(),
    gcCliente: '', gcAno: new Date().getFullYear(),
  },
};

const $id = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const moeda = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const num = v => { const n = parseFloat(String(v ?? '').replace(/\./g, '').replace(',', '.')); return isNaN(n) ? 0 : n; };
const numInput = id => { const el = $id(id); return el ? (parseFloat(el.value) || 0) : 0; };
const dataBR = d => { if (!d) return '—'; const s = String(d).slice(0, 10).split('-'); return s.length === 3 ? `${s[2]}/${s[1]}/${s[0]}` : String(d); };
const cpfFmt = c => { const d = String(c || '').replace(/\D/g, ''); return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : (c || '—'); };
const hoje = () => new Date().toISOString().slice(0, 10);

const MESES = ['01','02','03','04','05','06','07','08','09','10','11','12'];
const MES_NOME = { '01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril','05':'Maio','06':'Junho','07':'Julho','08':'Agosto','09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro' };

function toast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  $id('toasts').appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function erroHumano(e) {
  const m = String(e?.message || e || 'Erro inesperado');
  if (/invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/email not confirmed/i.test(m)) return 'E-mail ainda não confirmado. Peça ao administrador para confirmar seu cadastro.';
  if (/rate limit|too many requests/i.test(m)) return 'Muitas tentativas em pouco tempo. Aguarde alguns minutos.';
  if (/failed to fetch|networkerror/i.test(m)) return 'Falha de rede. Verifique sua conexão.';
  if (/jwt|token/i.test(m)) return 'Sessão expirada. Entre novamente.';
  return m;
}

// ── MODAL ──────────────────────────────────────────────────────────
let modalOnClose = null;
function openModal(titulo, bodyHTML, footHTML, opts = {}) {
  $id('modal-title').textContent = titulo;
  $id('modal-body').innerHTML = bodyHTML;
  $id('modal-foot').innerHTML = footHTML || '';
  $id('modal-box').classList.toggle('wide', !!opts.wide);
  $id('modal-overlay').classList.add('open');
  modalOnClose = opts.onClose || null;
}
function closeModal() {
  $id('modal-overlay').classList.remove('open');
  if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); }
}
$id('modal-overlay').addEventListener('mousedown', e => { if (e.target === $id('modal-overlay')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $id('modal-overlay').classList.contains('open')) closeModal(); });

function toggleSidebar(force) {
  document.body.classList.toggle('sb-open', force !== undefined ? force : !document.body.classList.contains('sb-open'));
}

// ── AUTH ───────────────────────────────────────────────────────────
async function doLogin(ev) {
  ev.preventDefault();
  const btn = $id('btn-login'); btn.disabled = true; btn.textContent = 'Entrando…';
  $id('login-err').textContent = '';
  try {
    const { data, error } = await db.auth.signInWithPassword({ email: $id('l-email').value.trim(), password: $id('l-senha').value });
    if (error) throw error;
    entrar(data.session);
  } catch (e) {
    $id('login-err').textContent = erroHumano(e);
  } finally {
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function doLogout() {
  try { await db.auth.signOut(); } catch (e) { /* sessão já inválida */ }
  location.reload();
}

function entrar(session) {
  S.user = session.user;
  $id('sb-user').textContent = S.user.email || '';
  $id('auth-screen').style.display = 'none';
  $id('app').style.display = 'block';
  carregarTudo();
}

async function init() {
  const { data } = await db.auth.getSession();
  if (data?.session) entrar(data.session);
  db.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_OUT') location.reload(); });
}

// ── DADOS ──────────────────────────────────────────────────────────
async function q(promessa, contexto) {
  const { data, error } = await promessa;
  if (error) { toast(`${contexto}: ${erroHumano(error)}`, 'error'); throw error; }
  return data;
}

async function carregarTudo() {
  try {
    const [cli, an, pe, op] = await Promise.all([
      q(db.from('ir_clientes').select('*').order('nome').limit(2000), 'Clientes'),
      q(db.from('ir_analises').select('*').order('created_at', { ascending: false }).limit(2000), 'Análises'),
      q(db.from('ir_pendencias').select('*').order('created_at', { ascending: false }).limit(2000), 'Pendências'),
      q(db.from('ir_oportunidades').select('*').order('created_at', { ascending: false }).limit(2000), 'Oportunidades'),
    ]);
    S.clientes = cli; S.analises = an; S.pendencias = pe; S.oportunidades = op;
    S.carregado = true;
    render();
  } catch (e) {
    $id('content').innerHTML = `<div class="empty">Não foi possível carregar os dados.<br>${esc(erroHumano(e))}</div>`;
  }
}

function cliente(id) { return S.clientes.find(c => c.id === id); }
function nomeCliente(id) { return cliente(id)?.nome || '(cliente removido)'; }

// auditoria best-effort — nunca bloqueia a operação principal
function audit(acao, tipo, recursoId, detalhe) {
  db.from('ir_auditoria').insert({
    usuario_id: S.user?.id || '', usuario_email: S.user?.email || '',
    acao, recurso_tipo: tipo, recurso_id: String(recursoId ?? ''), detalhe: detalhe || '',
  }).then(({ error }) => { if (error) console.warn('auditoria:', error.message); });
}

// ═══ DASHBOARD ═════════════════════════════════════════════════════
function statusDecl(c) {
  const d = c.declaracao || {};
  if (d.transmitida) return 'transmitida';
  if (d.status === 'entregue') return 'entregue';
  if (d.iniciada) return 'em_andamento';
  return 'pendente';
}
const STATUS_DECL_LABEL = { transmitida: 'Transmitida', entregue: 'Docs entregues', em_andamento: 'Em andamento', pendente: 'Pendente' };
const STATUS_DECL_COR = { transmitida: 'var(--green)', entregue: 'var(--azul)', em_andamento: 'var(--amber)', pendente: 'var(--red)' };

function renderDashboard() {
  const cs = S.clientes;
  const porStatus = { transmitida: 0, entregue: 0, em_andamento: 0, pendente: 0 };
  let honorarios = 0, recebido = 0, pagos = 0;
  cs.forEach(c => {
    porStatus[statusDecl(c)]++;
    const f = c.financeiro || {};
    honorarios += Number(f.honorario) || 0;
    recebido += Number(f.valor_pago) || 0;
    if (f.payment_status === 'sim') pagos++;
  });
  const peAbertas = S.pendencias.filter(p => p.status !== 'resolvida' && p.status !== 'cancelada').length;
  const opAtivas = S.oportunidades.filter(o => o.status !== 'descartada' && o.status !== 'aproveitada').length;
  const valorOp = S.oportunidades.filter(o => o.status !== 'descartada').reduce((s, o) => s + (Number(o.valor_estimado) || 0), 0);

  const distRow = (lbl, qt, total, cor) =>
    `<div class="dist-row"><span class="lbl">${lbl}</span><span class="bar"><i style="width:${total ? Math.round(qt / total * 100) : 0}%;background:${cor}"></i></span><span class="qt">${qt}</span></div>`;

  $id('content').innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Clientes</div><div class="v">${cs.length}</div><div class="d">base migrada</div></div>
      <div class="card"><div class="k">Transmitidas</div><div class="v">${porStatus.transmitida}</div><div class="d">de ${cs.length} declarações</div></div>
      <div class="card"><div class="k">Pendências abertas</div><div class="v">${peAbertas}</div><div class="d">${S.pendencias.length} no total</div></div>
      <div class="card"><div class="k">Oportunidades ativas</div><div class="v">${opAtivas}</div><div class="d">${moeda(valorOp)} estimados</div></div>
      <div class="card"><div class="k">Honorários</div><div class="v">${moeda(honorarios)}</div><div class="d">previstos no exercício</div></div>
      <div class="card"><div class="k">Recebido</div><div class="v">${moeda(recebido)}</div><div class="d">${pagos} clientes quitados</div></div>
    </div>
    <div class="panel"><div class="panel-head"><h2>Status das declarações</h2></div><div class="panel-body"><div class="dist">
      ${distRow('Transmitida', porStatus.transmitida, cs.length, 'var(--green)')}
      ${distRow('Docs entregues', porStatus.entregue, cs.length, 'var(--azul)')}
      ${distRow('Em andamento', porStatus.em_andamento, cs.length, 'var(--amber)')}
      ${distRow('Pendente', porStatus.pendente, cs.length, 'var(--red)')}
    </div></div></div>
    <div class="panel"><div class="panel-head"><h2>Análises recentes</h2><button class="btn sm solid" onclick="formAnalise()">+ Nova análise</button></div>
      <div class="tbl-wrap">${tabelaAnalises(S.analises.slice(0, 8))}</div>
    </div>`;
}

// ═══ CLIENTES ══════════════════════════════════════════════════════
function renderClientes() {
  const chips = [
    ['todos', 'Todos'], ['pendente', 'Pendentes'], ['em_andamento', 'Em andamento'],
    ['entregue', 'Docs entregues'], ['transmitida', 'Transmitidas'], ['nao_pago', 'Honorário em aberto'],
  ];
  const busca = S.f.cliBusca.toLowerCase();
  const lista = S.clientes.filter(c => {
    if (busca && !(c.nome || '').toLowerCase().includes(busca) && !(c.cpf || '').replace(/\D/g, '').includes(busca.replace(/\D/g, '') || '§')) return false;
    if (S.f.cliChip === 'todos') return true;
    if (S.f.cliChip === 'nao_pago') return (c.financeiro || {}).payment_status !== 'sim';
    return statusDecl(c) === S.f.cliChip;
  });

  $id('content').innerHTML = `
    <div class="toolbar">
      <input type="search" placeholder="Buscar por nome ou CPF…" value="${esc(S.f.cliBusca)}" oninput="S.f.cliBusca=this.value;renderClientesLista()">
      <div class="chips">${chips.map(([v, l]) => `<button class="chip${S.f.cliChip === v ? ' active' : ''}" onclick="S.f.cliChip='${v}';renderClientes()">${l}</button>`).join('')}</div>
      <button class="btn solid" onclick="formCliente()">+ Novo cliente</button>
    </div>
    <div class="panel"><div class="tbl-wrap" id="cli-lista"></div></div>`;
  renderClientesLista();
}

function renderClientesLista() {
  const busca = S.f.cliBusca.toLowerCase();
  const lista = S.clientes.filter(c => {
    if (busca) {
      const porNome = (c.nome || '').toLowerCase().includes(busca);
      const dig = busca.replace(/\D/g, '');
      const porCpf = dig && (c.cpf || '').replace(/\D/g, '').includes(dig);
      if (!porNome && !porCpf) return false;
    }
    if (S.f.cliChip === 'todos') return true;
    if (S.f.cliChip === 'nao_pago') return (c.financeiro || {}).payment_status !== 'sim';
    return statusDecl(c) === S.f.cliChip;
  });
  const badgeDecl = c => {
    const s = statusDecl(c);
    const cls = { transmitida: 'b-green', entregue: 'b-azul', em_andamento: 'b-amber', pendente: 'b-red' }[s];
    return `<span class="badge ${cls}">${STATUS_DECL_LABEL[s]}</span>`;
  };
  const badgePag = c => {
    const f = c.financeiro || {};
    return f.payment_status === 'sim'
      ? `<span class="badge b-green">Pago</span>`
      : (Number(f.valor_pago) > 0 ? `<span class="badge b-amber">Parcial</span>` : `<span class="badge b-red">Em aberto</span>`);
  };
  $id('cli-lista').innerHTML = lista.length ? `
    <table class="tbl"><thead><tr><th>Nome</th><th>CPF</th><th>Declaração</th><th>Resultado</th><th class="num">Honorário</th><th>Pagamento</th></tr></thead>
    <tbody>${lista.map(c => `
      <tr class="clickable" onclick="fichaCliente('${c.id}')">
        <td><strong>${esc(c.nome)}</strong>${c.obs ? `<div class="muted" style="font-size:11.5px">${esc(c.obs)}</div>` : ''}</td>
        <td class="mono">${esc(cpfFmt(c.cpf))}</td>
        <td>${badgeDecl(c)}</td>
        <td>${esc((c.declaracao || {}).resultado ? ({ restituicao: 'Restituição', pagar: 'A pagar', zero: 'Sem imposto' }[(c.declaracao || {}).resultado] || (c.declaracao || {}).resultado) : '—')}</td>
        <td class="num">${moeda((c.financeiro || {}).honorario)}</td>
        <td>${badgePag(c)}</td>
      </tr>`).join('')}</tbody></table>`
    : `<div class="empty">Nenhum cliente encontrado com esses filtros.</div>`;
}

    <div class="field-row-3">
      <div class="field"><label>Data de entrega</label><input type="date" id="fd-delivery" value="${esc(d.delivery_date)}"></div>

      <div class="field"><label>Nº de quotas</label><input type="number" min="1" max="8" id="fd-quotas" value="${Number(d.quotas) || 1}"></div>

    <div class="field-row">
      <div class="field"><label>Venc. da parcela</label><input type="date" id="fd-vencparc" value="${esc(d.venc_parcela)}"></div>

  if (fichaTab === 'financeiro') body += `
    <div class="field-row-3">
      <div class="field"><label>Honorário</label><input type="number" step="0.01" id="ff-hon" value="${Number(f.honorario) || 0}"></div>
      <div class="field"><label>Valor pago</label><input type="number" step="0.01" id="ff-pago" value="${Number(f.valor_pago) || 0}"></div>
      <div class="field"><label>Situação</label><select id="ff-status">${opt([['nao', 'Em aberto'], ['sim', 'Pago']], f.payment_status || 'nao')}</select></div>

function opt(lista, atual) {
  return lista.map(o => {
    const [v, l] = Array.isArray(o) ? o : [o, o.charAt(0).toUpperCase() + o.slice(1).replace(/_/g, ' ')];
    return `<option value="${esc(v)}"${String(atual) === String(v) ? ' selected' : ''}>${esc(l)}</option>`;
  }).join('');
}

async function salvarFicha(id) {
  const c = cliente(id); if (!c) return;
  const upd = { updated_at: new Date().toISOString() };
  if (fichaTab === 'dados') {
    upd.nome = $id('fc-nome').value.trim();
    upd.cpf = $id('fc-cpf').value.trim();
    upd.data_nascimento = $id('fc-nasc').value;
    upd.telefone = $id('fc-tel').value.trim();
    upd.email = $id('fc-email').value.trim();
    upd.obs = $id('fc-obs').value.trim();
    if (!upd.nome) { toast('Informe o nome.', 'error'); return; }
  }
  if (fichaTab === 'declaracao') {
    upd.declaracao = { ...(c.declaracao || {}),
      tipo: $id('fd-tipo').value, status: $id('fd-status').value, resultado: $id('fd-resultado').value,
      iniciada: $id('fd-iniciada').checked, revisada: $id('fd-revisada').checked, transmitida: $id('fd-transmitida').checked,
      delivery_date: $id('fd-delivery').value, valor: numInput('fd-valor'), quotas: parseInt($id('fd-quotas').value) || 1,
      venc_parcela: $id('fd-vencparc').value, valor_parcela: numInput('fd-valparc'),
    };
  }
  if (fichaTab === 'financeiro') {
    upd.financeiro = { ...(c.financeiro || {}),
      honorario: numInput('ff-hon'), valor_pago: numInput('ff-pago'), payment_status: $id('ff-status').value,
      forma: $id('ff-forma').value, vencimento: $id('ff-venc').value, data_pag: $id('ff-datapag').value, obs: $id('ff-obs').value.trim(),
    };
  }
  try {
    await q(db.from('ir_clientes').update(upd).eq('id', id), 'Salvar cliente');
    Object.assign(c, upd);
    audit('update', 'cliente', id, `aba ${fichaTab}`);
    toast('Cliente salvo.', 'success');
    closeModal();
  } catch (e) { /* toast já emitido */ }
}

async function salvarDocs(id) {
  const c = cliente(id); if (!c) return;
  const documentos = c.documentos || { items: [] };
  try {
    await q(db.from('ir_clientes').update({ documentos, updated_at: new Date().toISOString() }).eq('id', id), 'Checklist');
    audit('update', 'cliente', id, 'checklist de documentos');
  } catch (e) { /* toast já emitido */ }
}
function docToggle(id, i, val) {
  const it = (cliente(id)?.documentos?.items || [])[i]; if (!it) return;
  it.checked = val;
  if (val && !it.data_recebimento) it.data_recebimento = hoje();
  salvarDocs(id).then(() => fichaCliente(id, 'documentos'));
}
function docData(id, i, val) {
  const it = (cliente(id)?.documentos?.items || [])[i]; if (!it) return;
  it.data_recebimento = val; salvarDocs(id);
}
function docRemover(id, i) {
  const c = cliente(id); if (!c?.documentos?.items) return;
  c.documentos.items.splice(i, 1);
  salvarDocs(id).then(() => fichaCliente(id, 'documentos'));
}
function docAdicionar(id) {
  const c = cliente(id); if (!c) return;
  const label = $id('fdoc-novo').value.trim(); if (!label) return;
  c.documentos = c.documentos || {};
  c.documentos.items = c.documentos.items || [];

// ═══ ANÁLISES ══════════════════════════════════════════════════════
const AN_STATUS = [['importada', 'Importada'], ['em_analise', 'Em análise'], ['revisada', 'Revisada'], ['concluida', 'Concluída']];
const AN_STATUS_BADGE = { importada: 'b-gray', em_analise: 'b-amber', revisada: 'b-azul', concluida: 'b-green' };

function tabelaAnalises(lista, compacta) {
  if (!lista.length) return `<div class="empty">Nenhuma análise registrada.</div>`;
  return `<table class="tbl"><thead><tr>${compacta ? '' : '<th>Cliente</th>'}<th>Exercício</th><th>Status</th><th class="num">Rendimentos</th><th class="num">Deduções</th><th class="num">Saldo</th><th></th></tr></thead>
  <tbody>${lista.map(a => `
    <tr class="clickable" onclick="formAnalise('${a.id}')">
      ${compacta ? '' : `<td><strong>${esc(nomeCliente(a.cliente_id))}</strong></td>`}
      <td class="mono">${a.exercicio || '—'}</td>
      <td><span class="badge ${AN_STATUS_BADGE[a.status] || 'b-gray'}">${esc((AN_STATUS.find(s => s[0] === a.status) || [, a.status || '—'])[1])}</span></td>
      <td class="num">${moeda(a.total_rendimentos)}</td>
      <td class="num">${moeda(a.total_deducoes)}</td>
      <td class="num" style="color:${Number(a.saldo) < 0 ? 'var(--red)' : 'var(--green)'}">${moeda(a.saldo)}</td>
      <td class="muted" style="font-size:11.5px">${dataBR(a.created_at)}</td>
    </tr>`).join('')}</tbody></table>`;
}

function renderAnalises() {
  const exs = [...new Set(S.analises.map(a => a.exercicio).filter(Boolean))].sort((a, b) => b - a);
  const busca = S.f.anBusca.toLowerCase();
  const lista = S.analises.filter(a => {
    if (S.f.anExercicio !== 'todos' && String(a.exercicio) !== S.f.anExercicio) return false;
    if (busca && !nomeCliente(a.cliente_id).toLowerCase().includes(busca)) return false;
    return true;
  });
  $id('content').innerHTML = `
    <div class="toolbar">
      <input type="search" placeholder="Buscar por cliente…" value="${esc(S.f.anBusca)}" oninput="S.f.anBusca=this.value;renderAnalises()">
      <select onchange="S.f.anExercicio=this.value;renderAnalises()">
        <option value="todos">Todos os exercícios</option>
        ${exs.map(e => `<option value="${e}"${S.f.anExercicio === String(e) ? ' selected' : ''}>Exercício ${e}</option>`).join('')}

}

function selectCliente(idSel, atual) {

async function salvarAnalise(id) {
  const saldoManual = $id('an-saldo').value;
  const retido = numInput('an-ret'), devido = numInput('an-dev');
  const row = {
    cliente_id: $id('an-cli').value, usuario_id: S.user.id,
    exercicio: parseInt($id('an-ex').value) || new Date().getFullYear(),
    status: $id('an-status').value,
    total_rendimentos: numInput('an-rend'), total_deducoes: numInput('an-ded'),
    imposto_devido: devido, imposto_retido: retido,
    saldo: saldoManual === '' ? +(retido - devido).toFixed(2) : parseFloat(saldoManual),
    score_risco: parseInt($id('an-sr').value) || 0,
    score_oportunidade: parseInt($id('an-so').value) || 0,
    score_documental: parseInt($id('an-sd').value) || 0,
    variacao_patrimonial: numInput('an-var'),
    arquivo_nome: $id('an-arq').value.trim(),
    updated_at: new Date().toISOString(),
  };
  try {
    if (id) {
      const [upd] = await q(db.from('ir_analises').update(row).eq('id', id).select(), 'Salvar análise');
      const i = S.analises.findIndex(x => x.id === id); if (i >= 0) S.analises[i] = upd;
      audit('update', 'analise', id, `exercício ${row.exercicio}`);
    } else {
      const [novo] = await q(db.from('ir_analises').insert(row).select(), 'Criar análise');
      S.analises.unshift(novo);
      audit('insert', 'analise', novo.id, `exercício ${row.exercicio} · ${nomeCliente(row.cliente_id)}`);
    }
    toast('Análise salva.', 'success');
    closeModal(); render();
  } catch (e) { /* toast já emitido */ }
}

async function excluirAnalise(id) {
  if (!confirm('Excluir esta análise? As pendências e oportunidades vinculadas a ela não são removidas.')) return;
  try {
    await q(db.from('ir_analises').delete().eq('id', id), 'Excluir análise');
    S.analises = S.analises.filter(a => a.id !== id);
    audit('delete', 'analise', id, '');
    toast('Análise excluída.', 'success');
    closeModal(); render();
  } catch (e) { /* toast já emitido */ }
}

async function salvarPendencia(id) {
  const titulo = $id('pe-titulo').value.trim();
  if (!titulo) { toast('Informe o título.', 'error'); return; }
  const row = {
    cliente_id: $id('pe-cli').value, usuario_id: S.user.id,
    exercicio: parseInt($id('pe-ex').value) || null,
    titulo, descricao: $id('pe-desc').value.trim(),
    categoria: $id('pe-cat').value, severidade: $id('pe-sev').value, prioridade: $id('pe-pri').value,
    valor_impacto: numInput('pe-imp'),
    updated_at: new Date().toISOString(),
  };
  if (id) row.resolucao = $id('pe-res')?.value.trim() || '';
  try {
    if (id) {
      const [upd] = await q(db.from('ir_pendencias').update(row).eq('id', id).select(), 'Salvar pendência');
      const i = S.pendencias.findIndex(x => x.id === id); if (i >= 0) S.pendencias[i] = upd;
      audit('update', 'pendencia', id, titulo);
    } else {
      row.status = 'aberta';
      const [novo] = await q(db.from('ir_pendencias').insert(row).select(), 'Criar pendência');
      S.pendencias.unshift(novo);
      audit('insert', 'pendencia', novo.id, titulo);
    }
    toast('Pendência salva.', 'success');
    closeModal(); render();
  } catch (e) { /* toast já emitido */ }
}

async function resolverPendencia(id) {
  const resol = $id('pe-res')?.value.trim() || '';
  try {
    const [upd] = await q(db.from('ir_pendencias').update({ status: 'resolvida', resolucao: resol, resolvido_em: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', id).select(), 'Resolver pendência');
    const i = S.pendencias.findIndex(x => x.id === id); if (i >= 0) S.pendencias[i] = upd;
    audit('update', 'pendencia', id, 'resolvida');
    toast('Pendência resolvida.', 'success');
    closeModal(); render();
  } catch (e) { /* toast já emitido */ }
}

// exclusão genérica (pendência, oportunidade, carnê-leão, RV, GC)
async function excluirRegistro(tabela, tipo, id) {
  if (!confirm('Excluir este registro? Esta ação não pode ser desfeita.')) return;
  try {
    await q(db.from(tabela).delete().eq('id', id), 'Excluir');
    const chave = { ir_pendencias: 'pendencias', ir_oportunidades: 'oportunidades' }[tabela];
    if (chave) S[chave] = S[chave].filter(r => r.id !== id);
    audit('delete', tipo, id, '');
    toast('Registro excluído.', 'success');
    closeModal(); render();
  } catch (e) { /* toast já emitido */ }
}

// Tabela progressiva mensal do IRPF por vigência (competência AAAA-MM).
const TABELAS_MENSAIS = [
  { desde: '2025-05', faixas: [[2428.80, 0, 0], [2826.65, .075, 182.16], [3751.05, .15, 394.16], [4664.68, .225, 675.49], [Infinity, .275, 908.73]] },
  { desde: '2024-02', faixas: [[2259.20, 0, 0], [2826.65, .075, 169.44], [3751.05, .15, 381.44], [4664.68, .225, 662.77], [Infinity, .275, 896.00]] },
  { desde: '2023-05', faixas: [[2112.00, 0, 0], [2826.65, .075, 158.40], [3751.05, .15, 370.40], [4664.68, .225, 651.73], [Infinity, .275, 884.96]] },
  { desde: '0000-01', faixas: [[1903.98, 0, 0], [2826.65, .075, 142.80], [3751.05, .15, 354.80], [4664.68, .225, 636.13], [Infinity, .275, 869.36]] },
];
const DEDUCAO_DEPENDENTE = 189.59;

function calcIRMensal(base, ano, mes) {
  if (base <= 0) return 0;
  const comp = `${ano}-${mes}`;
  const tab = TABELAS_MENSAIS.find(t => comp >= t.desde) || TABELAS_MENSAIS[TABELAS_MENSAIS.length - 1];
  const fx = tab.faixas.find(f => base <= f[0]);
  return Math.max(0, +(base * fx[1] - fx[2]).toFixed(2));
}

function anosOpts(sel) {

}

async function salvarCarne(id) {
  const mes = $id('cl-mes').value, dep = parseInt($id('cl-dep').value) || 0;
  const rec = numInput('cl-rec'), ded = numInput('cl-ded');
  const base = Math.max(0, +(rec - ded - dep * DEDUCAO_DEPENDENTE).toFixed(2));
  const row = {
    cliente_id: S.f.clCliente, ano: S.f.clAno, mes,
    tipo_receita: $id('cl-tipo').value, pagador: $id('cl-pag').value.trim(),
    total_recebido: rec, deducoes: ded, num_dependentes: dep,
    base_calculo: base, ir_devido: calcIRMensal(base, S.f.clAno, mes),
    darf_pago: $id('cl-darf').checked,
    updated_at: new Date().toISOString(),
  };
  try {
    if (id) {
      await q(db.from('ir_carne_leao').update(row).eq('id', id), 'Salvar carnê-leão');
      audit('update', 'carne_leao', id, `${S.f.clAno}-${mes}`);

      const [novo] = await q(db.from('ir_carne_leao').insert(row).select(), 'Criar carnê-leão');
      audit('insert', 'carne_leao', novo.id, `${S.f.clAno}-${mes} · ${nomeCliente(row.cliente_id)}`);
    }
    toast('Lançamento salvo.', 'success');
    closeModal(); renderCarneLeao();
  } catch (e) { /* toast já emitido */ }
}

async function salvarRV(id) {

  const venda = numInput('rv-venda'), custo = numInput('rv-custo'), prej = numInput('rv-prej'), irrf = numInput('rv-irrf');

  const isento = $id('rv-isento').checked;
  const base = Math.max(0, resultado - prej);
  const ir = isento ? 0 : Math.max(0, +(base * RV_ALIQ[tipo] - irrf).toFixed(2));
  const row = {
    cliente_id: S.f.rvCliente, ano: S.f.rvAno, mes: $id('rv-mes').value,
    tipo, ativo: $id('rv-ativo').value.trim(),
    quantidade_vendida: parseFloat($id('rv-qt').value) || 0,
    valor_venda: venda, custo_aquisicao: custo, resultado_liquido: resultado,
    prejuizo_compensado: prej, irrf_retido: irrf, ir_devido: ir,
    isento, darf_pago: $id('rv-darf').checked,
    updated_at: new Date().toISOString(),
  };
  try {
    if (id) {
      await q(db.from('ir_renda_variavel').update(row).eq('id', id), 'Salvar operação');

        <tr class="clickable" onclick="formGC('${r.id}')">
          <td>${MES_NOME[r.mes] || r.mes}</td>
          <td><strong>${esc((GC_TIPOS.find(t => t[0] === r.tipo_bem) || [, r.tipo_bem])[1])}</strong>${r.descricao_bem ? `<div class="muted" style="font-size:11.5px">${esc(r.descricao_bem)}</div>` : ''}</td>
          <td class="num">${moeda(r.valor_alienacao)}</td>
          <td class="num">${moeda((Number(r.custo_aquisicao) || 0) + (Number(r.valor_melhorias) || 0))}</td>
          <td class="num" style="color:${Number(r.ganho_liquido) < 0 ? 'var(--red)' : 'var(--green)'}">${moeda(r.ganho_liquido)}</td>
          <td class="num">${r.isento ? '—' : ((Number(r.aliquota) || 0) * 100).toLocaleString('pt-BR') + '%'}</td>
          <td class="num"><strong>${r.isento ? 'Isento' : moeda(r.ir_devido)}</strong></td>
          <td>${r.isento ? '<span class="badge b-azul">Isento</span>' : r.darf_pago ? '<span class="badge b-green">Pago</span>' : '<span class="badge b-amber">Pendente</span>'}</td>
        </tr>`).join('')}</tbody></table>` : '<div class="empty">Nenhuma alienação registrada neste ano.</div>'}
    </div>`;
}

function formGC(id) {
  const r = id ? GC.find(x => x.id === id) : null;
  openModal(r ? 'Editar alienação' : 'Nova alienação · Ganho de Capital', `
    <div class="field-row">
      <div class="field"><label>Mês da alienação</label><select id="gc-mes">${MESES.map(m => `<option value="${m}"${(r?.mes || MESES[new Date().getMonth()]) === m ? ' selected' : ''}>${MES_NOME[m]}</option>`).join('')}</select></div>
      <div class="field"><label>Tipo de bem</label><select id="gc-tipo">${opt(GC_TIPOS, r?.tipo_bem || 'imovel')}</select></div>
    </div>
    <div class="field"><label>Descrição do bem</label><input id="gc-desc" value="${esc(r?.descricao_bem || '')}" placeholder="ex.: Apartamento Rua X, 123 — matrícula 45.678"></div>
    <div class="field-row-3">
      <div class="field"><label>Valor de alienação</label><input type="number" step="0.01" id="gc-alien" value="${Number(r?.valor_alienacao) || 0}"></div>
      <div class="field"><label>Custo de aquisição</label><input type="number" step="0.01" id="gc-custo" value="${Number(r?.custo_aquisicao) || 0}"></div>
      <div class="field"><label>Melhorias/benfeitorias</label><input type="number" step="0.01" id="gc-melh" value="${Number(r?.valor_melhorias) || 0}"></div>
    </div>
    <div class="check-line"><input type="checkbox" id="gc-isento" ${r?.isento ? 'checked' : ''}><label for="gc-isento">Alienação isenta</label></div>
    <div class="field"><label>Hipótese de isenção</label><select id="gc-tipoisencao"><option value="">—</option>${opt(GC_ISENCOES, r?.tipo_isencao)}</select></div>
    <div class="check-line"><input type="checkbox" id="gc-darf" ${r?.darf_pago ? 'checked' : ''}><label for="gc-darf">DARF pago (código 4600) — vence no último dia útil do mês seguinte</label></div>
    <div class="muted" style="font-size:12px">Ganho e IR são recalculados ao salvar: alíquota progressiva de 15% a 22,5% conforme o ganho (Lei 13.259/2016).</div>`,
    `${r ? `<button class="btn danger" onclick="excluirModulo('ir_ganho_capital','ganho_capital','${r.id}',renderGC)">Excluir</button>` : ''}
     <button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn solid" onclick="salvarGC(${r ? `'${r.id}'` : 'null'})">Salvar</button>`);
}

async function salvarGC(id) {
  const alien = numInput('gc-alien'), custo = numInput('gc-custo'), melh = numInput('gc-melh');
  const ganho = +(alien - custo - melh).toFixed(2);
  const isento = $id('gc-isento').checked;
  const aliq = (isento || ganho <= 0) ? 0 : aliquotaGC(ganho);
  const row = {
    cliente_id: S.f.gcCliente, ano: S.f.gcAno, mes: $id('gc-mes').value,
    tipo_bem: $id('gc-tipo').value, descricao_bem: $id('gc-desc').value.trim(),
    valor_alienacao: alien, custo_aquisicao: custo, valor_melhorias: melh,
    ganho_liquido: ganho, isento, tipo_isencao: $id('gc-tipoisencao').value,
    aliquota: aliq, ir_devido: +(Math.max(0, ganho) * aliq).toFixed(2),
    darf_pago: $id('gc-darf').checked,
    updated_at: new Date().toISOString(),
  };
  try {
    if (id) {
      await q(db.from('ir_ganho_capital').update(row).eq('id', id), 'Salvar alienação');
      audit('update', 'ganho_capital', id, `${row.ano}-${row.mes}`);
    } else {
      const [novo] = await q(db.from('ir_ganho_capital').insert(row).select(), 'Criar alienação');
      audit('insert', 'ganho_capital', novo.id, `${row.ano}-${row.mes} · ${nomeCliente(row.cliente_id)}`);
    }
    toast('Alienação salva.', 'success');
    closeModal(); renderGC();
  } catch (e) { /* toast já emitido */ }
}

init();
</script>
</body>
</html>
